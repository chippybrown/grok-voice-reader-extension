<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Grok Voice Reader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Grok Voice Reader <span id="version"></span></h1>
    <p id="status">Checking this tab…</p>
  </header>
  <section id="piper-offer" hidden>
    <p>This browser has few English voices. You can download a free Piper voice. It stays on this computer.</p>
    <button id="piper-offer-yes" type="button">Show voices</button>
    <button id="piper-offer-no" type="button">Not now</button>
  </section>
  <section id="piper-list-wrap" hidden>
    <p>Piper voices</p>
    <ul id="piper-list"></ul>
  </section>
  <label class="switch">
    <input id="enabled" type="checkbox">
    <span>Read new replies aloud</span>
  </label>
  <label class="switch">
    <input id="debug" type="checkbox">
    <span>Show what it detects</span>
  </label>
  <p id="update" hidden></p>
  <label class="field">
    Default voice
    <select id="voice"></select>
  </label>
  <label class="field">
    <span id="bot-voice-label">Voice for this bot</span>
    <select id="bot-voice"></select>
  </label>
  <label class="switch">
    <input id="bot-read" type="checkbox">
    <span id="bot-read-label">Read this bot aloud</span>
  </label>
  <label class="switch">
    <input id="new-bots" type="checkbox">
    <span>New bots on by default</span>
  </label>
  <label class="switch">
    <input id="beta" type="checkbox">
    <span>Offer beta updates</span>
  </label>
  <label class="field">
    Rate <span id="rate-value">1.0</span>
    <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1">
  </label>
  <div class="buttons transport">
    <button id="play-pause" class="icon" type="button"></button>
    <button id="stop" type="button">Stop</button>
    <button id="replay" type="button">Replay last</button>
  </div>
  <script src="src/config.js"></script>
  <script src="src/text.js"></script>
  <script src="src/bots.js"></script>
  <script src="src/controls.js"></script>
  <script src="src/piper.js"></script>
  <script src="popup.js"></script>
</body>
</html>
